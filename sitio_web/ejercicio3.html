<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Resaltados de texto y control de fuentes</title>
</head>
<body bgcolor="#EBDCA7">

    <!-- Sección Superior: Efecto de espejo y perspectiva -->
    <center>
        <p>
            <font size="7">O</font><font size="6">I</font><font size="5">I</font><font size="4">I</font><font size="3">I</font><font size="2">I</font><font size="1">I</font><font size="1">I</font><font size="2">I</font><font size="3">I</font><font size="4">I</font><font size="5">I</font><font size="6">I</font><font size="7">O</font>
        </p>
    </center>

    <br>

    <!-- Sección Media: Tamaños absolutos del 1 al 7 -->
    <center>
        <p>
            <font size="1">size=1</font>
            <font size="2">size=2</font>
            <font size="3">size=3</font>
            <font size="4">size=4</font>
            <font size="5">size=5</font>
            <font size="6">size=6</font>
            <font size="7">size=7</font>
        </p>
    </center>

    <br>

    <!-- Sección Inferior: Tamaños relativos con signo positivo y negativo -->
    <center>
        <p>
            <font size="+4">size=+4</font>
            <font size="+3">size=+3</font>
            <font size="+2">size=+2</font>
            <font size="+1">size=+1</font>
            <font size="-1">size=-1</font>
            <font size="-2">size=-2</font>
        </p>
    </center>

</body>
</html>
